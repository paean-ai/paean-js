name: Paean SDK

on:
  push:
    branches: [main, 'upstream/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk:
    name: SDK / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: packages/paean-js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/paean-js/package-lock.json
      - run: node ../../scripts/paean/check-upstream.mjs
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: paean-browser-node-${{ matrix.node }}
          path: packages/paean-js/test-results
      - run: npm pack --pack-destination .
        if: matrix.node == 24
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.node == 24
        with:
          name: paean-js-package
          path: packages/paean-js/*.tgz
